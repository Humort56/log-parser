name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Without this, one interpreter's failure cancels the others and hides
      # whether the problem is version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Dependencies live in pyproject.toml; without this the cache key
          # has no requirements*.txt to hash.
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,ui]"

      - name: Test
        run: python -m pytest

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Must match [tool.mypy] python_version. mypy parses installed
          # third-party stubs under that target, not under the interpreter
          # running it -- and numpy >=2.5 (Python 3.12+ only) writes its stubs
          # with PEP 695 `type` statements, which are a syntax error below 3.12.
          # A newer interpreter here resolves that numpy and mypy dies inside
          # numpy's stub rather than in this project.
          python-version: "3.10"
          cache: pip
          # Dependencies live in pyproject.toml; without this the cache key
          # has no requirements*.txt to hash.
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev,ui]"

      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Mypy
        run: python -m mypy
